<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1430">
<meta name="description" content="Happy Birthday Chloe! Tim's Dog Band plays the birthday song.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Happy Birthday Chloe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Patrick+Hand&display=swap">
<style>
/* Layout: the whole card is a little theater. Velvet valance and side curtains frame it; a bulb-lit
   marquee sign carries the title; twelve dogs stand on wooden risers; footlights and a wooden stage
   front sit at the bottom. One deliberate look in both themes. */
:root{
  --table:#9fd6ff;
  --paper:#fffaf0;
  --ink:#1d1a24;
  --pink:#ff5d8f;
  --cobalt:#2f4cff;
  --sky:#7cc8ff;
  --mint:#5fe0b0;
  --sun:#ffb02e;
  --bulb:#ffe29a;
  --muted:#6b6274;
  --backstage:#2a1f3d;
  --drape:#3a2858;
  --drape-deep:#1c1430;
  --wood-light:#e2aa6a;
  --backstage-deep:#1b1428;
  --velvet:#c8243f;
  --velvet-dark:#86122b;
  --wood:#c98a4b;
  --wood-dark:#8a5428;
  --wood-deep:#5e3519;
  --stage-text:#fff3dc;
  --stage-muted:#c9bcdc;
  --side:clamp(40px,9vw,100px);
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
}
html,body{min-height:100%}
body{
  background:var(--table);
  color:var(--ink);font-family:var(--hand);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 40px;
}

/* ---------- the theater (the whole card) ---------- */
.card{
  max-width:1020px;margin:0 auto;position:relative;overflow:hidden;
  border:3px solid var(--ink);border-radius:22px;box-shadow:8px 9px 0 var(--ink);
  color:var(--stage-text);
  background:
    radial-gradient(ellipse 26% 50% at 26% 0, rgba(255,232,160,.24), transparent 72%),
    radial-gradient(ellipse 26% 50% at 74% 0, rgba(255,232,160,.24), transparent 72%),
    radial-gradient(ellipse 70% 22% at 50% 100%, rgba(255,200,120,.14), transparent 70%),
    linear-gradient(transparent 70%, rgba(10,6,20,.45)),
    repeating-linear-gradient(90deg, rgba(0,0,0,.32) 0px, rgba(255,255,255,.05) 26px, rgba(0,0,0,.32) 52px),
    linear-gradient(var(--drape), var(--drape-deep) 88%);
  padding:66px var(--side) 0;
}
.valance{
  position:absolute;left:0;right:0;top:0;height:50px;z-index:6;pointer-events:none;
  background:
    radial-gradient(circle at 50% 0,var(--velvet) 64%,var(--ink) 65% 72%,transparent 73%) 0 22px/56px 28px repeat-x,
    linear-gradient(var(--velvet-dark),var(--velvet) 60%) 0 0/100% 24px no-repeat;
}
.valance::after{ /* gold rope */
  content:"";position:absolute;left:0;right:0;top:19px;height:5px;
  background:repeating-linear-gradient(115deg,var(--sun) 0 6px,#d98a12 6px 9px);
  border-block:1.5px solid var(--ink);
}
.curtain{
  position:absolute;top:0;bottom:0;width:calc(var(--side) - 6px);z-index:5;pointer-events:none;
  filter:drop-shadow(3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink));
}
.curtain.l{left:0}
.curtain.r{right:0;transform:scaleX(-1)}
.drape{ /* gathered at the waist by a gold tassel, flaring out to the floor */
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(0,0,0,.28),transparent 45%),
    repeating-linear-gradient(90deg,var(--velvet-dark) 0px,var(--velvet) 9px,#e2445e 13px,var(--velvet) 17px,var(--velvet-dark) 26px);
  clip-path:polygon(0 0,100% 0,96% 12%,70% 30%,34% 45%,40% 52%,66% 70%,90% 88%,100% 100%,0 100%);
}
.tassel{position:absolute;top:calc(45% - 10px);left:calc(34% - 12px);width:20px;height:20px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink)}
.tassel::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:22px;transform:translateX(-50%);
  background:repeating-linear-gradient(90deg,var(--sun) 0 2px,#d98a12 2px 3px);border:2px solid var(--ink);border-top:0;border-radius:0 0 4px 4px}

/* ---------- marquee sign ---------- */
header{text-align:center;position:relative;z-index:3}
.marquee{
  display:inline-block;max-width:100%;padding:13px;border:3px solid var(--ink);border-radius:26px;
  background:radial-gradient(circle,var(--bulb) 0 3.5px,var(--ink) 4.5px 5.5px,transparent 6px) 0 0/22px 22px,var(--velvet-dark);
  box-shadow:0 0 34px rgba(255,214,120,.28);
}
.marquee{cursor:pointer;transition:box-shadow .6s}
.marquee:not(.lit){box-shadow:none;background:radial-gradient(circle,#7d6b48 0 3.5px,var(--ink) 4.5px 5.5px,transparent 6px) 0 0/22px 22px,#4f0c1c}
/* dim = a smoky layer over the sign; lit = the layer fades away and the letters glow (no CSS filters, so phones agree) */
.sign{position:relative}
.sign::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(34,22,44,.55);pointer-events:none;transition:opacity .7s}
.marquee:not(.lit) .sign::after{animation:flicker 5s infinite}
.marquee.lit .sign::after{opacity:0}
.marquee.lit{box-shadow:0 0 44px rgba(255,214,120,.45)}
.marquee.lit .sign{box-shadow:inset 0 0 36px rgba(255,214,140,.55)}
.marquee.lit .sign h1{animation:neon 1.1s linear both;
  text-shadow:var(--drop),0 0 12px rgba(255,160,195,.95),0 0 30px rgba(255,93,143,.6)}
.marquee.lit .sign h1 .name{text-shadow:var(--drop),0 0 12px rgba(124,200,255,1),0 0 30px rgba(124,200,255,.65)}
@keyframes neon{0%{opacity:.4}8%{opacity:1}14%{opacity:.45}22%{opacity:1}34%{opacity:.6}42%,100%{opacity:1}}
.playing .marquee.lit{animation:chase .5s steps(2) infinite}
.sign{
  background-color:var(--paper);border:3px solid var(--ink);border-radius:16px;
  padding:clamp(14px,2.6vw,24px) clamp(16px,4vw,46px) clamp(16px,3vw,28px);
}
.eyebrow{font-size:1.3rem;color:var(--muted);letter-spacing:.1em;margin:0 0 6px}
h1{
  font-family:var(--display);font-weight:400;margin:0;line-height:.95;
  font-size:clamp(2.3rem,7.6vw,5.4rem);text-wrap:balance;color:var(--pink);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  --drop:4px 5px 0 var(--ink);text-shadow:var(--drop);
}
h1 .name{display:block;color:var(--sky);font-size:1.25em;transform:rotate(-3deg);margin-top:.08em}
h1 .name span{display:inline-block}
.marquee.lit h1 .name span{animation:hop 1.4s ease-in-out infinite}
.marquee.lit h1 .name span:nth-child(2){animation-delay:.1s}.marquee.lit h1 .name span:nth-child(3){animation-delay:.2s}
.marquee.lit h1 .name span:nth-child(4){animation-delay:.3s}.marquee.lit h1 .name span:nth-child(5){animation-delay:.4s}

.welcome{margin:16px 0 0;font-family:var(--display);font-size:clamp(1.6rem,4.4vw,2.6rem);line-height:1.05;color:var(--sun);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 var(--ink);animation:popin .6s cubic-bezier(.2,1.6,.4,1) both}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{
  font:inherit;font-size:1.25rem;cursor:pointer;
  background:var(--cobalt);color:var(--paper);border:3px solid var(--ink);
  border-radius:999px;padding:8px 22px 6px;box-shadow:3px 4px 0 var(--ink);
  transition:transform .12s;
}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn:hover{transform:translate(-1px,-2px)}
.btn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:3px dashed var(--sun);outline-offset:4px}
.nowplaying{min-height:4.2rem;margin-top:10px}
.controls:not(:has(.btn:not([hidden]))){display:none}
.round{display:inline-block;margin:0;padding:2px 14px 0;border:2px solid var(--ink);border-radius:999px;background:var(--sun);color:var(--ink);font-size:1.1rem;
  --tilt:-2deg;transform:rotate(var(--tilt));box-shadow:2px 3px 0 var(--ink)}
.round[data-r="0"]{background:#c9b6ff;--tilt:-3deg}
.round[data-r="1"]{background:var(--sun);--tilt:2deg}
.round[data-r="2"]{background:var(--mint);--tilt:-2deg}
.round[data-r="3"]{background:var(--pink);--tilt:3deg}
.round[data-r="4"]{background:var(--sky);--tilt:-1.5deg}
.round.pop{animation:roundpop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes roundpop{from{transform:scale(.4) rotate(calc(var(--tilt) * -3));opacity:0}to{transform:rotate(var(--tilt));opacity:1}}
[hidden]{display:none!important}
.lyric{min-height:1.6em;font-size:1.55rem;margin:6px 0 0;text-align:center;color:var(--bulb)}

/* ---------- the band on risers ---------- */
.band{position:relative;z-index:2;margin:6px 0 0;display:flex;flex-direction:column;gap:12px}
.tier{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:0;row-gap:12px}
.tier li{min-width:0;display:flex}
.dog{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;
  background:none;border:0;padding:0 0 10px;margin:0;cursor:pointer;font:inherit;color:var(--stage-text);
  border-radius:10px;
}
.dog{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dog:disabled{cursor:default;color:var(--stage-text)}
.dog:focus-visible{outline:3px dashed var(--sun);outline-offset:-2px}
.who{position:absolute;inset:0;z-index:1}
.who,.label{opacity:0;transform:translateY(18px) scale(.92)}
.open .who,.open .label{animation:walkon .7s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--row) * .6s + var(--col) * .1s + .5s)}
@keyframes walkon{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
.btn{touch-action:manipulation}
.slot{position:relative;width:100%;aspect-ratio:1/0.8;display:flex;align-items:flex-end;justify-content:center}
/* three different risers: tall draped platform at the back, wooden riser in the middle, stage floor in front */
.slot::after{content:"";position:absolute;left:0;right:0;z-index:0}
.t1 .slot::after{
  bottom:-36px;height:42px;border-top:3px solid var(--ink);
  background:
    radial-gradient(circle at 50% 0,var(--velvet-dark) 0 60%,var(--ink) 61% 70%,transparent 71%) 0 28px/28px 14px repeat-x,
    linear-gradient(var(--velvet),var(--velvet-dark)) 0 15px/100% 14px no-repeat,
    linear-gradient(var(--ink),var(--ink)) 0 10px/100% 2px no-repeat,
    linear-gradient(var(--sun),#d98a12) 0 11px/100% 4px no-repeat,
    linear-gradient(var(--wood-light),var(--wood)) 0 0/100% 10px no-repeat;
}
.t2 .slot::after{
  bottom:-26px;height:30px;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);
  background:
    linear-gradient(var(--wood-light),var(--wood)) 0 0/100% 8px no-repeat,
    linear-gradient(var(--ink),var(--ink)) 0 8px/100% 2px no-repeat,
    repeating-linear-gradient(90deg,transparent 0 44px,rgba(0,0,0,.3) 44px 46px),
    linear-gradient(var(--wood),var(--wood-dark));
}
.t3 .slot::after{bottom:-12px;height:14px;background:linear-gradient(var(--wood-light),var(--wood));border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.t3 .slot::before{content:"";position:absolute;left:4%;right:4%;bottom:-2px;height:30px;z-index:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,236,170,.5),rgba(255,236,170,.12) 65%,transparent)}
.slot img{position:absolute;z-index:1;left:0;right:0;bottom:0;margin:0 auto;max-width:90%;max-height:100%;transform-origin:50% 100%;
  animation:bob var(--spd,1.4s) ease-in-out infinite;animation-delay:var(--dly,0s);
  transition:filter .25s}
.inst{
  position:absolute;z-index:2;font-size:clamp(2.1rem,5vw,3.5rem);line-height:1;
  left:var(--ix,4%);bottom:var(--iy,4%);transition:opacity .25s;
  filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink));
}
.playing .dog:not(.muted) .inst{animation:wiggle .5s ease-in-out infinite alternate;animation-delay:var(--dly,0s)}
.label{margin-top:16px;font-size:1.05rem;line-height:1.1}
.t1 .label{margin-top:42px}
.t2 .label{margin-top:32px}
.t3 .label{margin-top:18px}
.label b{display:block;font-weight:400;font-size:1.2rem}
.label small{color:var(--stage-muted);font-size:.95rem}
.badge{position:absolute;z-index:3;top:4px;right:6px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  border-radius:999px;padding:1px 9px 0;font-size:.9rem;transform:rotate(6deg)}
.dog .badge{display:none}
.dog.muted .badge{display:block;animation:doze 2.6s ease-in-out infinite;animation-delay:var(--dly,0s)}
.dog.muted img{filter:grayscale(.85) brightness(.42);animation-play-state:paused}
.dog.muted .inst{opacity:.25}
.dog.muted .label{color:var(--stage-muted)}
.dog.hit img{animation:jump .26s ease-out}
.dog.hit .inst{transform:scale(1.25) rotate(-10deg)}

/* ---------- footlights and stage front ---------- */
.apron{
  position:relative;z-index:4;margin:22px calc(-1 * var(--side)) 0;height:30px;
  background:
    radial-gradient(circle,var(--bulb) 0 5px,var(--ink) 6px 8px,transparent 9px) 0 5px/56px 20px repeat-x,
    linear-gradient(var(--wood) 0 62%,var(--wood-dark) 62%);
  border-top:3px solid var(--ink);
}
.apron::before{ /* glow of the footlights */
  content:"";position:absolute;left:0;right:0;bottom:100%;height:60px;pointer-events:none;
  background:linear-gradient(transparent,rgba(255,214,120,.16));
}
.front{
  position:relative;z-index:4;margin:0 calc(-1 * var(--side));
  padding:14px var(--side) 18px;text-align:center;
  background:repeating-linear-gradient(90deg,var(--wood-dark) 0 64px,var(--wood-deep) 64px 67px);
  border-top:3px solid var(--ink);
}
.hint{margin:0;font-size:1.15rem;letter-spacing:.12em;color:var(--stage-text)}
.front footer{margin:0 0 4px;font-family:var(--display);font-size:clamp(1.4rem,3vw,1.9rem);color:var(--sun);
  -webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 3px 0 var(--ink);letter-spacing:.02em}

.note{position:absolute;pointer-events:none;font-size:1.8rem;z-index:5;
  animation:float 1.4s ease-out forwards;font-family:serif;text-shadow:1px 1px 0 var(--ink)}

@keyframes popin{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes flicker{0%,82%,100%{opacity:1}84%{opacity:.55}86%{opacity:1}88%{opacity:.4}91%{opacity:1}}
@keyframes doze{0%,100%{transform:translateY(0) rotate(6deg);opacity:1}50%{transform:translateY(-5px) rotate(-4deg);opacity:.7}}
@keyframes chase{to{background-position:11px 0,0 0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-4px) rotate(1.2deg)}}
@keyframes wiggle{from{transform:rotate(-10deg)}to{transform:rotate(8deg) translateY(-3px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.05,.96)}100%{transform:translateY(0)}}
@keyframes float{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx,20px),-80px) rotate(25deg);opacity:0}}

@media (max-width:560px){
  :root{--side:20px}
  body{padding-block:10px 16px}
  .card{padding-top:44px;border-radius:16px;box-shadow:5px 6px 0 var(--ink)}
  .valance{height:38px;background-size:40px 20px,100% 18px;background-position:0 16px,0 0}
  .valance::after{top:14px;height:4px}
  .tassel{display:none}
  .marquee{padding:8px;border-radius:18px;background-size:16px 16px,auto}
  .sign{padding:8px 10px 12px;border-radius:12px}
  .eyebrow{font-size:.95rem;margin-bottom:2px}
  h1{font-size:clamp(1.5rem,8.1vw,2.3rem);white-space:nowrap;-webkit-text-stroke:2px var(--ink);--drop:2px 3px 0 var(--ink);text-shadow:var(--drop)}
  .welcome{font-size:1.3rem;margin-top:8px;-webkit-text-stroke:1.5px var(--ink);text-shadow:2px 3px 0 var(--ink)}
  .controls{margin-top:8px;gap:8px}
  .btn{font-size:1rem;padding:5px 14px 4px;border-width:2.5px;box-shadow:2px 3px 0 var(--ink)}
  .nowplaying{min-height:2.9rem;margin-top:6px}
  .round{font-size:.9rem}
  .lyric{font-size:1.1rem;margin-top:3px}
  .band{gap:4px}
  .tier{row-gap:4px}
  .slot{aspect-ratio:1/0.92}
  .inst{font-size:1.45rem}
  .badge{font-size:.62rem;padding:0 5px;top:0;right:0;border-width:1.5px}
  .label{font-size:.8rem}
  .label b{font-size:.86rem}
  .label small{font-size:.68rem}
  .t1 .slot::after{bottom:-22px;height:26px;background-size:16px 8px,100% 8px,100% 2px,100% 3px,100% 6px;
    background-position:0 18px,0 9px,0 6px,0 6px,0 0}
  .t2 .slot::after{bottom:-16px;height:18px}
  .t3 .slot::after{bottom:-8px;height:9px}
  .t1 .label{margin-top:26px}
  .t2 .label{margin-top:20px}
  .t3 .label{margin-top:12px}
  .dog{padding-bottom:4px}
  .apron{margin-top:10px;height:22px;background-size:40px 16px,auto;background-position:0 3px,0 0}
  .front{padding:8px var(--side) 10px}
  .hint{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.open .who,.open .label{opacity:1;transform:none}}
</style>

</head>
<body>
<main class="card" id="theater">
  <div class="valance" aria-hidden="true"></div>
  <div class="curtain l" aria-hidden="true"><div class="drape"></div><span class="tassel"></span></div>
  <div class="curtain r" aria-hidden="true"><div class="drape"></div><span class="tassel"></span></div>
  <header>
    <div class="marquee" id="marquee" title="Tap to start the band">
      <div class="sign">
        <p class="eyebrow">November 6th</p>
        <h1>Happy Birthday <span class="name" aria-label="Chloe"><span>C</span><span>h</span><span>l</span><span>o</span><span>e</span></span></h1>
      </div>
    </div>
    <p class="welcome" id="welcome" hidden>Welcome Tim’s Dog Band</p>
    <div class="controls">
      <button class="btn" id="play" type="button" hidden>▶ Play</button>
      <button class="btn alt" id="all" type="button" hidden>Wake up everyone</button>
    </div>
    <div class="nowplaying">
      <p class="round" id="round" hidden></p>
      <p class="lyric" id="lyric" aria-live="polite"></p>
    </div>
  </header>
  <div class="band" id="band" aria-label="The band on stage">
    <ul class="tier t1"></ul>
    <ul class="tier t2"></ul>
    <ul class="tier t3"></ul>
  </div>
  <div class="apron" aria-hidden="true"></div>
  <div class="front">
    <p class="hint">made by Dogood.AI</p>
  </div>

  g.gain.linearRampToValueAtTime(0,t+dur+.32);
  f.connect(g); g.connect(dest);
  const l=ctx.createOscillator(), lg=ctx.createGain(); l.frequency.value=5.4;
  lg.gain.setValueAtTime(0,t); lg.gain.setValueAtTime(0,t+.18); lg.gain.linearRampToValueAtTime(f0*(long?.011:.006),t+.5);
  l.connect(lg); keep(l,t,end);
  [-7,0,7].forEach(dt=>{ const os=ctx.createOscillator(); os.setPeriodicWave(WAVES.strings); os.frequency.value=f0; os.detune.value=dt;
    lg.connect(os.frequency); const og=ctx.createGain(); og.gain.value=1/3; os.connect(og); og.connect(f); keep(os,t,end); });
  noise(dest,t,{freq:f0*3,q:2.5,peak:.018*v,a:.04,decay:.18});
}
const SYNTH={
  harp:(d,t,dur,m,v)=>each(m,n=>plucked(d,t,dur,n,v)),
  flute:(d,t,dur,m,v)=>{ voice(d,{t,dur:dur*.92,m,wave:"flute",peak:.1*v,a:.06,rel:.12,vib:.007,vibDelay:.25});
    noise(d,t,{freq:mtof(m)*1.5,q:4,peak:.012*v,a:.03,decay:.12}); },
  violin:(d,t,dur,m,v)=>bowed(d,t,dur,m,v),
  trumpet:(d,t,dur,m,v)=>voice(d,{t,dur,m,wave:"horn",peak:.12*v,a:.05,rel:.12,vib:.005,vibDelay:.3,lp:1500,lpFrom:500,lpTime:.15}),
  sax:(d,t,dur,m,v)=>voice(d,{t,dur:dur*.9,m,wave:"reed",peak:.085*v,a:.05,rel:.12,vib:.007,lp:1250}),
  accordion:(d,t,dur,m,v)=>{ const chord=Array.isArray(m)&&m.length>1;
    each(m,n=>voice(d,{t,dur,m:n,wave:"squeeze",detune:[-7,7],peak:(chord?.06:.14)*v,a:.04,rel:.08,lp:chord?1500:700,trem:.12})); },
  keys:(d,t,dur,m,v)=>each(m,n=>voice(d,{t,dur,m:n,wave:"piano",peak:.13*v,a:.006,decay:.9,rel:.02,lp:2600})),
  guitar:(d,t,dur,m,v)=>each(m,(n,i)=>voice(d,{t:t+i*.022,dur,m:n,wave:"nylon",peak:.09*v,a:.004,decay:.8,rel:.02,lp:900,lpFrom:2600,lpTime:.25})),
  banjo:(d,t,dur,m,v)=>each(m,(n,i)=>voice(d,{t:t+i*.014,dur,m:n,wave:"uke",peak:.085*v,a:.003,decay:.3,rel:.02,lp:1400,lpFrom:3000,lpTime:.1})),
  bongo:(d,t,dur,hi,v)=>drum(d,t,hi?300:200,hi?240:150,.34*v,.2),
  snare:(d,t,dur,kind,v)=>{ // a soft frame drum: felt thump plus a little skin
    if(kind===2){ drum(d,t,95,62,.55*v,1.4); noise(d,t,{type:"lowpass",freq:500,q:.5,peak:.08*v,a:.2,decay:.9}); return; } // timpani swell
    if(kind===1){ noise(d,t,{freq:1600,q:.6,peak:.06*v,a:.04,decay:.22}); return; }                                 // brushes
    drum(d,t,170,120,.26*v,.16); noise(d,t,{freq:1100,q:.8,peak:.07*v,decay:.09}); },
  maracas:(d,t,dur,m,v)=>noise(d,t,{freq:4200,q:.9,peak:.22*v,a:.008,decay:.06}),
};
const MELODIC=new Set(["harp","flute","violin","trumpet","sax"]);
// A ~2 second link before each round: the band breathes on the next key's dominant chord
// (G7 into C, A7 into D), the keyboard climbs, the violin holds, the maracas swell into the pickup.
// Times are in seconds; pitches are written in C and transposed with the round.
const BRIDGE=2.0;
const LINK=[
  ["accordion",0,1.9,43,.45], ["accordion",0,1.9,[47,50,53,55],.5],
  ["guitar",0,1.2,[55,59,62,65],.55],
  ["violin",.05,1.85,74,.7],
  ["keys",0,.8,55,.5],["keys",.25,.8,59,.5],["keys",.5,.8,62,.5],["keys",.75,.8,65,.5],["keys",1,.8,67,.5],["keys",1.25,.8,71,.5],["keys",1.5,.8,74,.45],
  ["maracas",1.4,.1,0,.3],["maracas",1.5,.1,0,.4],["maracas",1.6,.1,0,.5],["maracas",1.7,.1,0,.6],["maracas",1.8,.1,0,.7],["maracas",1.9,.1,0,.8],
];
function scheduleRound(i,at,bridge){
  const R=ROUNDS[i], start=at+(bridge?BRIDGE:0);
  if(bridge){
    LINK.forEach(([k,s,len,m,v])=>{
      const mm=DRUMS.has(k)?m:(Array.isArray(m)?m.map(n=>n+R.tr):m+R.tr);
      SYNTH[k](trackGain[k],at+s,len,mm,v); events.push({t:at+s,key:k});
    });
    if(i>=2) [55,59,62,65,67,71,74,77,79,83].forEach((n,j)=>{ const s=1.05+j*.07; SYNTH.harp(trackGain.harp,at+s,1.2,n+R.tr,.38); events.push({t:at+s,key:"harp"}); });
    events.push({t:at,clear:true});
  }
  BAND.forEach(d=>{
    const dest=trackGain[d.key], drumTrack=DRUMS.has(d.key);
    R.parts[d.key].forEach(([b,len,m,v])=>{
      const t=start+b*R.beat;
      const mm=drumTrack?m:(Array.isArray(m)?m.map(n=>n+R.tr):m+R.tr);
      SYNTH[d.key](dest,t,len*R.beat,mm,v);
      events.push({t,key:d.key});
    });
  });
  MEL.forEach(([b,,,syl])=>events.push({t:start+b*R.beat,syl}));
  events.push({t:at,round:i});
  events.sort((x,y)=>x.t-y.t);
  nextStart=start+R.len*R.beat; nextRound=(i+1)%ROUNDS.length;
}
const marqueeEl=document.getElementById("marquee"), welcomeEl=document.getElementById("welcome"), lyric=document.getElementById("lyric"), roundEl=document.getElementById("round"), playBtn=document.getElementById("play");
let words=[], lastHit={};
function tidy(ws){ return ws.join(" ").replace(/Hap py/g,"Happy").replace(/birth day/g,"birthday").replace("Chlo e","Chloe"); }
function tick(){
  if(!playing) return;
  const now=ctx.currentTime;
  while(events.length && events[0].t<=now){
    const e=events.shift();
    if(e.clear){ words=[]; lyric.textContent=""; }
    else if(e.round!==undefined){ roundEl.textContent=ROUNDS[e.round].label; roundEl.dataset.r=e.round; roundEl.hidden=false;
      roundEl.classList.remove("pop"); void roundEl.offsetWidth; roundEl.classList.add("pop"); }
    else if(e.syl){ if(e.syl==="Hap") words=[]; words.push(e.syl); lyric.textContent=tidy(words); }
    else if(e.key && !muted.has(e.key)){
      const el=dogEl[e.key], ms=performance.now();
      if(!lastHit[e.key] || ms-lastHit[e.key]>170){
        lastHit[e.key]=ms; el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit");
        if(MELODIC.has(e.key) && Math.random()<.45) popNote(el);
      }
    }
  }
  raf=requestAnimationFrame(tick);
}
function popNote(el){
  const card=document.querySelector(".card"), r=el.getBoundingClientRect(), cr=card.getBoundingClientRect();
  const n=document.createElement("span"); n.className="note";
  n.textContent=["♪","♫","♬","♩"][Math.floor(Math.random()*4)];
  n.style.left=(r.left-cr.left+r.width*(.3+Math.random()*.4))+"px"; n.style.top=(r.top-cr.top+r.height*.15)+"px";
  n.style.setProperty("--dx",(Math.random()*60-30)+"px"); n.style.color=cols[Math.floor(Math.random()*4)];
  card.appendChild(n); setTimeout(()=>n.remove(),1500);
}
// iPhones mute web audio when the ring switch is on silent; a looping silent <audio> and the
// audioSession hint move the page into "playback" so the band can be heard anyway.
let unlocked=false;
function unlockAudio(){
  if(unlocked) return; unlocked=true;
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  try{ const a=new Audio(SILENCE); a.loop=true; a.setAttribute("playsinline",""); a.volume=0.01; a.play().catch(()=>{}); }catch(e){}
}
function start(){
  unlockAudio();
  if(!ensureCtx()){ lyric.textContent="This browser can't play sound, but the band is still very proud."; return; }
  ctx.resume(); master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(.75,ctx.currentTime);
  playing=true; started=true; theater.classList.add("playing"); lyric.textContent="";
  events=[]; words=[]; scheduleRound(0,ctx.currentTime+.12);
  timer=setInterval(()=>{ if(ctx.currentTime>nextStart-.6) scheduleRound(nextRound,nextStart,true); },100);
  raf=requestAnimationFrame(tick);
  refreshUI();
}
function stop(){
  playing=false; clearInterval(timer); cancelAnimationFrame(raf); events=[];
  theater.classList.remove("playing"); roundEl.hidden=true;
  if(ctx){ const t=ctx.currentTime, old=[...live]; live.clear(); master.gain.setTargetAtTime(0,t,.03);
    setTimeout(()=>old.forEach(n=>{try{n.stop();}catch(e){}}),150); }
  refreshUI();
}

/* ---------------- the show: closed → sign lit, dogs walk on asleep → wake them one by one ---------------- */
let opened=false, started=false;
function openShow(){
  if(opened) return; opened=true;
  unlockAudio();
  marqueeEl.classList.add("lit"); welcomeEl.hidden=false; theater.classList.add("open");
  BAND.forEach(d=>dogEl[d.key].disabled=false);
  refreshUI();
}
function refreshUI(){
  const asleep=BAND.filter(d=>muted.has(d.key)).length;
  // no buttons until the music has started: the sign, then the dogs, are the only things to tap
  playBtn.hidden = !started;
  playBtn.textContent = playing ? "■ Stop the band" : "▶ Play";
  allBtn.hidden = !playing || asleep===0;
  if(!playing) lyric.textContent = "";
}
playBtn.addEventListener("click",()=>{
  if(!opened) return openShow();
  if(playing) return stop();
  if(muted.size===BAND.length) BAND.forEach(d=>toggleMute(d,false)); // nobody awake: wake the whole band
  start();
});
marqueeEl.addEventListener("click",openShow);
onWake=d=>{ if(!playing) start(); };
onChange=refreshUI;
refreshUI();
</script>

</body>
